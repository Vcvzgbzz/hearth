<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1024" width="1160" height="1024" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#e4e0db"/></pattern>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.08"/></filter>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9a928a"/></marker>
  </defs>
  <rect width="1160" height="1024" fill="#fbfaf8"/>
  <rect width="1160" height="1024" fill="url(#dots)"/>

  <!-- header -->
  <text x="40" y="44" font-size="20" font-weight="650" fill="#2b2724">Pipeline</text>
  <text x="40" y="66" font-size="12" fill="#7d756d">What happens to a chat request on its way through, in the order it happens.</text>
  <g font-size="12">
    <rect x="620" y="30" width="190" height="32" rx="8" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
    <text x="634" y="51" fill="#7d756d">Router</text><text x="686" y="51" fill="#2b2724" font-weight="600">app</text><text x="790" y="51" fill="#7d756d">▾</text>
    <rect x="822" y="30" width="150" height="32" rx="8" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
    <text x="836" y="51" fill="#2b2724">⧉ Effective chain</text>
    <rect x="984" y="30" width="136" height="32" rx="8" fill="#e06a2c"/>
    <text x="1000" y="51" fill="#fff" font-weight="600">▶ Try a request</text>
  </g>

  <!-- request kinds: one pipeline each -->
  <g font-size="12.5">
    <line x1="40" y1="110" x2="1120" y2="110" stroke="#e7e4e0"/>
    <text x="40" y="100" fill="#2b2724" font-weight="650">Chat</text><text x="76" y="100" fill="#7d756d" font-size="11">5</text>
    <rect x="40" y="108" width="48" height="3" rx="1.5" fill="#e06a2c"/>
    <text x="112" y="100" fill="#5e5750">Embeddings</text><text x="186" y="100" fill="#7d756d" font-size="11">1</text>
    <text x="210" y="100" fill="#5e5750">Images</text><text x="256" y="100" fill="#7d756d" font-size="11">1</text>
    <text x="280" y="100" fill="#5e5750">Video</text><text x="318" y="100" fill="#7d756d" font-size="11">0</text>
    <text x="342" y="100" fill="#5e5750">Speech</text><text x="390" y="100" fill="#7d756d" font-size="11">0</text>
    <text x="414" y="100" fill="#5e5750">Other</text><text x="452" y="100" fill="#7d756d" font-size="11">0</text>
    <text x="600" y="100" fill="#7d756d" font-size="11">Each kind of request has its own pipeline. A plugin only appears under the kinds it declares.</text>
  </g>
  <g transform="translate(0,44)">

  <!-- lifecycle strip: fixed steps between the stages -->
  <line x1="40" y1="100" x2="1120" y2="100" stroke="#d9d4ce" stroke-width="2"/>
  <g font-size="10.5" fill="#7d756d">
    <circle cx="40" cy="100" r="5" fill="#9a928a"/><text x="32" y="88">admit</text>
    <circle cx="248" cy="100" r="5" fill="#9a928a"/><text x="232" y="88">route</text>
    <circle cx="464" cy="100" r="5" fill="#9a928a"/><text x="438" y="88">queue · run</text>
    <circle cx="896" cy="100" r="5" fill="#9a928a"/><text x="880" y="88">done</text>
    <circle cx="1120" cy="100" r="5" fill="#9a928a"/>
  </g>
  <rect x="464" y="96" width="432" height="8" rx="4" fill="#f3d9c9"/>
  <text x="600" y="122" font-size="10.5" fill="#b4592a">the model runs here (holds a GPU slot)</text>

  <!-- stage columns -->
  <g>
    <rect x="40" y="136" width="200" height="332" rx="12" fill="#fff" stroke="#e7e4e0"/>
    <rect x="256" y="136" width="200" height="332" rx="12" fill="#fff" stroke="#e7e4e0"/>
    <rect x="472" y="136" width="200" height="332" rx="12" fill="#fff" stroke="#e7e4e0"/>
    <rect x="688" y="136" width="200" height="332" rx="12" fill="#fff" stroke="#e7e4e0"/>
    <rect x="904" y="136" width="216" height="332" rx="12" fill="#fff" stroke="#e7e4e0"/>
  </g>
  <g font-size="12.5" font-weight="650" fill="#2b2724">
    <text x="56" y="162">1 · Before routing</text>
    <text x="272" y="162">2 · After routing</text>
    <text x="488" y="162">3 · Alongside the model</text>
    <text x="704" y="162">4 · The reply</text>
    <text x="920" y="162">5 · After the reply</text>
  </g>
  <g font-size="10.5" fill="#7d756d">
    <text x="56" y="179">can change or refuse · holds no slot</text>
    <text x="272" y="179">knows local or peer · can change</text>
    <text x="488" y="179">can refuse, can't change · no wait</text>
    <text x="704" y="179">each chunk · code plugins only</text>
    <text x="920" y="179">watch only · never delays the reply</text>
  </g>

  <!-- col 1 -->
  <g>
    <rect x="52" y="194" width="176" height="92" rx="10" fill="#fff" stroke="#2e9d62" stroke-width="1.6" filter="url(#sh)"/>
    <text x="64" y="215" font-size="12.5" font-weight="600" fill="#2b2724">🧩 block-secrets</text>
    <circle cx="216" cy="210" r="4" fill="#2e9d62"/>
    <rect x="64" y="224" width="40" height="17" rx="8.5" fill="#fdeeee"/><text x="70" y="236" font-size="10" fill="#b33a3a">code ⚠</text>
    <rect x="110" y="224" width="46" height="17" rx="8.5" fill="#efece8"/><text x="118" y="236" font-size="10" fill="#5e5750">global</text>
    <rect x="162" y="224" width="52" height="17" rx="8.5" fill="#2b2724"/><text x="170" y="236" font-size="10" fill="#fff">locked</text>
    <text x="64" y="258" font-size="10.5" fill="#7d756d">fails closed · 0.4 ms p50</text>
    <text x="64" y="274" font-size="10.5" fill="#7d756d">2 refused today</text>
  </g>

  <!-- col 2 -->
  <g>
    <rect x="268" y="194" width="176" height="92" rx="10" fill="#fff" stroke="#d99a2b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="280" y="215" font-size="12.5" font-weight="600" fill="#2b2724">🧩 memory</text>
    <circle cx="432" cy="210" r="4" fill="#d99a2b"/>
    <rect x="280" y="224" width="34" height="17" rx="8.5" fill="#eef4fc"/><text x="287" y="236" font-size="10" fill="#3b7dd8">http</text>
    <rect x="320" y="224" width="72" height="17" rx="8.5" fill="#e3edfb"/><text x="328" y="236" font-size="10" fill="#2f66b8">this router</text>
    <text x="280" y="258" font-size="10.5" fill="#7d756d">fails open · 38 / 240 ms</text>
    <text x="280" y="274" font-size="10.5" fill="#b07c1e">near its 300 ms timeout</text>
    <text x="406" y="274" font-size="10" fill="#3b7dd8">⇢ 5</text>

    <rect x="268" y="298" width="176" height="92" rx="10" fill="#fff" stroke="#2e9d62" stroke-width="1.6" filter="url(#sh)"/>
    <text x="280" y="319" font-size="12.5" font-weight="600" fill="#2b2724">🧩 redact-emails</text>
    <circle cx="432" cy="314" r="4" fill="#2e9d62"/>
    <rect x="280" y="328" width="40" height="17" rx="8.5" fill="#fdeeee"/><text x="286" y="340" font-size="10" fill="#b33a3a">code ⚠</text>
    <rect x="326" y="328" width="46" height="17" rx="8.5" fill="#efece8"/><text x="334" y="340" font-size="10" fill="#5e5750">global</text>
    <text x="280" y="362" font-size="10.5" fill="#7d756d">fails closed · 1 ms</text>
    <text x="280" y="378" font-size="10.5" fill="#7d756d">only when routed to a peer</text>
  </g>

  <!-- col 3 -->
  <g>
    <rect x="484" y="194" width="176" height="92" rx="10" fill="#fff" stroke="#2e9d62" stroke-width="1.6" filter="url(#sh)"/>
    <text x="496" y="215" font-size="12.5" font-weight="600" fill="#2b2724">🧩 safety</text>
    <circle cx="648" cy="210" r="4" fill="#2e9d62"/>
    <rect x="496" y="224" width="34" height="17" rx="8.5" fill="#eef4fc"/><text x="503" y="236" font-size="10" fill="#3b7dd8">http</text>
    <rect x="536" y="224" width="46" height="17" rx="8.5" fill="#efece8"/><text x="544" y="236" font-size="10" fill="#5e5750">global</text>
    <rect x="588" y="224" width="52" height="17" rx="8.5" fill="#2b2724"/><text x="596" y="236" font-size="10" fill="#fff">locked</text>
    <text x="496" y="258" font-size="10.5" fill="#7d756d">fails closed · 12 ms</text>
    <text x="496" y="274" font-size="10.5" fill="#7d756d">stops the reply if it flags</text>
  </g>

  <!-- col 4: empty -->
  <rect x="700" y="194" width="176" height="92" rx="10" fill="none" stroke="#d9d4ce" stroke-dasharray="5 4"/>
  <text x="714" y="232" font-size="11" fill="#9a928a">No plugin reads the reply</text>
  <text x="714" y="250" font-size="11" fill="#9a928a">as it streams.</text>
  <text x="714" y="272" font-size="10.5" fill="#3b7dd8">+ Add a plugin</text>

  <!-- col 5 -->
  <g>
    <rect x="916" y="194" width="192" height="92" rx="10" fill="#fff" stroke="#2e9d62" stroke-width="1.6" filter="url(#sh)"/>
    <text x="928" y="215" font-size="12.5" font-weight="600" fill="#2b2724">🧩 memory</text>
    <circle cx="1096" cy="210" r="4" fill="#2e9d62"/>
    <rect x="928" y="224" width="34" height="17" rx="8.5" fill="#eef4fc"/><text x="935" y="236" font-size="10" fill="#3b7dd8">http</text>
    <rect x="968" y="224" width="72" height="17" rx="8.5" fill="#e3edfb"/><text x="976" y="236" font-size="10" fill="#2f66b8">this router</text>
    <text x="928" y="258" font-size="10.5" fill="#7d756d">saves the conversation</text>
    <text x="928" y="274" font-size="10.5" fill="#3b7dd8">⇠ same plugin as stage 2</text>

    <rect x="916" y="298" width="192" height="72" rx="10" fill="#f6f5f3" stroke="#d9d4ce" filter="url(#sh)"/>
    <text x="928" y="319" font-size="12.5" font-weight="600" fill="#9a928a">🧩 audit-log</text><line x1="946" y1="315" x2="1012" y2="315" stroke="#9a928a"/>
    <rect x="928" y="328" width="46" height="17" rx="8.5" fill="#efece8"/><text x="936" y="340" font-size="10" fill="#9a928a">global</text>
    <text x="928" y="360" font-size="10.5" fill="#9a928a">turned off for this router</text>
  </g>

  <!-- inherited row -->
  <rect x="40" y="480" width="1080" height="40" rx="8" fill="#f8f7f5" stroke="#ece9e5"/>
  <text x="56" y="505" font-size="11.5" fill="#5e5750">▸ Router <tspan font-weight="600">app</tspan> runs 4 global plugins and 1 of its own. 1 global plugin is turned off here. Locked plugins can't be turned off by a router.</text>

  <!-- what another kind's tab looks like -->
  <rect x="40" y="528" width="1080" height="34" rx="8" fill="#fff" stroke="#e7e4e0" stroke-dasharray="4 3"/>
  <text x="56" y="550" font-size="11" fill="#5e5750"><tspan font-weight="600">On the Images tab:</tspan> stages 1, 2, 4 (the whole image) and 5 only · 1 plugin, <tspan font-weight="600">image-safety</tspan> · memory is chat-only, so it is never offered there and never runs on an image request.</text>

  <!-- on error lane -->
  <rect x="40" y="572" width="1080" height="64" rx="12" fill="#fff" stroke="#e7e4e0"/>
  <text x="56" y="598" font-size="12.5" font-weight="650" fill="#2b2724">On error</text>
  <text x="56" y="616" font-size="10.5" fill="#7d756d">a backend, peer or plugin failed</text>
  <rect x="260" y="584" width="230" height="40" rx="9" fill="#fff" stroke="#2e9d62" stroke-width="1.6" filter="url(#sh)"/>
  <text x="272" y="609" font-size="12" font-weight="600" fill="#2b2724">🧩 notify-me</text>
  <rect x="366" y="596" width="34" height="17" rx="8.5" fill="#eef4fc"/><text x="373" y="608" font-size="10" fill="#3b7dd8">http</text>
  <rect x="406" y="596" width="46" height="17" rx="8.5" fill="#efece8"/><text x="414" y="608" font-size="10" fill="#5e5750">global</text>
  <text x="520" y="609" font-size="11" fill="#b07c1e">⚠ memory failed open 3 times in the last hour: requests went on without it</text>

  <!-- Try panel -->
  <rect x="40" y="656" width="700" height="300" rx="12" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="58" y="682" font-size="13.5" font-weight="650" fill="#2b2724">Try a request</text>
  <text x="170" y="682" font-size="10.5" fill="#7d756d">stops before the GPU unless you ask it to run the model</text>
  <g font-size="11.5">
    <rect x="58" y="694" width="110" height="28" rx="7" fill="#f8f7f5" stroke="#e7e4e0"/><text x="68" y="712" fill="#7d756d">caller</text><text x="112" y="712" fill="#2b2724" font-weight="600">app</text>
    <rect x="176" y="694" width="110" height="28" rx="7" fill="#f8f7f5" stroke="#e7e4e0"/><text x="186" y="712" fill="#7d756d">model</text><text x="228" y="712" fill="#2b2724" font-weight="600">chat</text>
    <rect x="294" y="694" width="330" height="28" rx="7" fill="#f8f7f5" stroke="#e7e4e0"/><text x="304" y="712" fill="#2b2724">which editor do I use? mail me at a@b.example</text>
    <rect x="632" y="694" width="90" height="28" rx="7" fill="#2b2724"/><text x="652" y="712" fill="#fff" font-weight="600">▶ Try</text>
  </g>
  <g font-size="11.5" fill="#2b2724">
    <circle cx="66" cy="745" r="4" fill="#2e9d62"/><text x="78" y="749">1 · block-secrets</text><text x="250" y="749" fill="#7d756d">passed · 0.3 ms</text>
    <circle cx="66" cy="771" r="4" fill="#9a928a"/><text x="78" y="775" fill="#7d756d">route → local · gpu0 · chat</text>
    <circle cx="66" cy="797" r="4" fill="#2e9d62"/><text x="78" y="801">2 · memory</text><text x="250" y="801" fill="#2e7d4f">added 2 memories (+412 tokens) · 41 ms</text>
    <rect x="250" y="809" width="470" height="44" rx="6" fill="#eef8f1" stroke="#cfe9d8"/>
    <text x="260" y="826" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#2e7d4f">+ &lt;memory name="editor"&gt;Prefers helix.&lt;/memory&gt;</text>
    <text x="260" y="843" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#2e7d4f">+ &lt;memory name="shell"&gt;Uses fish.&lt;/memory&gt;</text>
    <circle cx="66" cy="873" r="4" fill="#c9c4be"/><text x="78" y="877" fill="#7d756d">2 · redact-emails</text><text x="250" y="877" fill="#7d756d">skipped: routed local, its rule is peers only</text>
    <circle cx="66" cy="899" r="4" fill="#c9c4be"/><text x="78" y="903" fill="#7d756d">3 · safety</text><text x="250" y="903" fill="#7d756d">runs with the model: not run in a dry run</text>
    <text x="78" y="935" font-weight="600">Would reach chat with 1,620 tokens</text>
    <text x="330" y="935" fill="#3b7dd8">Run it for real ▸</text>
  </g>

  <!-- routing map inset -->
  <rect x="756" y="656" width="364" height="300" rx="12" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="774" y="682" font-size="13.5" font-weight="650" fill="#2b2724">Meanwhile, on the Routing map</text>
  <text x="774" y="700" font-size="10.5" fill="#7d756d">each router shows what runs on its requests</text>
  <rect x="790" y="720" width="296" height="104" rx="10" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="806" y="744" font-size="13" font-weight="600" fill="#2b2724">⑂ app</text>
  <text x="852" y="744" font-size="11" fill="#7d756d">for app · 3 rules</text>
  <circle cx="1072" cy="740" r="4" fill="#3b7dd8"/>
  <g font-size="10">
    <rect x="806" y="756" width="70" height="20" rx="10" fill="#e3edfb"/><text x="816" y="770" fill="#2f66b8">🧩 memory</text>
    <rect x="882" y="756" width="96" height="20" rx="10" fill="#f8f7f5" stroke="#e7e4e0"/><text x="892" y="770" fill="#5e5750">+4 from global</text>
    <rect x="984" y="756" width="88" height="20" rx="10" fill="#f6f5f3"/><text x="994" y="770" fill="#9a928a">audit-log</text><line x1="993" y1="766" x2="1040" y2="766" stroke="#9a928a"/>
  </g>
  <text x="806" y="804" font-size="10.5" fill="#3b7dd8">Open in Pipeline ▸</text>
  <text x="774" y="860" font-size="11" fill="#5e5750">Topology keeps only a badge on Dispatch:</text>
  <rect x="790" y="874" width="200" height="46" rx="10" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="806" y="894" font-size="12.5" font-weight="600" fill="#2b2724">⇄ Dispatch</text>
  <rect x="806" y="901" width="132" height="15" rx="7.5" fill="#fdf3e2"/><text x="814" y="912" font-size="9.5" fill="#b07c1e">5 plugins · 1 slow ▸</text>
  </g>
</svg>
