<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#e4e0db"/></pattern>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.08"/></filter>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9a928a"/></marker>
    <marker id="arrP" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b7dd8"/></marker>
  </defs>
  <rect width="1100" height="900" fill="#fbfaf8"/>
  <rect width="1100" height="900" fill="url(#dots)"/>

  <!-- node / callers -->
  <rect x="300" y="20" width="420" height="96" rx="14" fill="#fff" stroke="#e7e4e0"/>
  <text x="318" y="44" font-size="13" font-weight="600" fill="#2b2724">🔥 node</text>
  <text x="318" y="62" font-size="11" fill="#7d756d">2 running · 0 queued · requests from</text>
  <g font-size="12" fill="#2b2724">
    <rect x="318" y="74" width="120" height="28" rx="7" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/><text x="332" y="92">🔑 app</text><circle cx="426" cy="88" r="4" fill="#3b7dd8"/>
    <rect x="450" y="74" width="120" height="28" rx="7" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/><text x="464" y="92">🔑 agent</text><circle cx="558" cy="88" r="4" fill="#3b7dd8"/>
    <rect x="582" y="74" width="120" height="28" rx="7" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/><text x="596" y="92">🖥 local</text><circle cx="690" cy="88" r="4" fill="#3b7dd8"/>
  </g>

  <!-- router -->
  <line x1="510" y1="116" x2="510" y2="160" stroke="#9a928a" stroke-width="1.5"/>
  <rect x="420" y="160" width="180" height="50" rx="10" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="436" y="181" font-size="13" font-weight="600" fill="#2b2724">⑂ default router</text>
  <text x="436" y="199" font-size="11" fill="#7d756d">for everyone</text>
  <circle cx="586" cy="176" r="4" fill="#3b7dd8"/>

  <!-- plugins group -->
  <line x1="510" y1="210" x2="510" y2="248" stroke="#9a928a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="300" y="250" width="420" height="232" rx="14" fill="#f6f8fd" stroke="#3b7dd8" stroke-dasharray="5 4" stroke-opacity="0.6"/>
  <text x="318" y="272" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#3b7dd8">PLUGINS · IN CONFIG ORDER</text>

  <!-- plugin: memory (http, slow) -->
  <rect x="318" y="284" width="384" height="88" rx="10" fill="#fff" stroke="#d99a2b" stroke-width="1.6" filter="url(#sh)"/>
  <text x="334" y="306" font-size="13" font-weight="600" fill="#2b2724">🧩 memory</text>
  <text x="414" y="306" font-size="11" fill="#7d756d">🔒 kept local</text>
  <circle cx="688" cy="300" r="4" fill="#d99a2b"/>
  <text x="334" y="326" font-size="11" fill="#7d756d">http · coder, chat · near its 300 ms timeout</text>
  <g font-size="10.5">
    <rect x="334" y="338" width="62" height="20" rx="10" fill="#eef4fc"/><text x="345" y="352" fill="#3b7dd8">routed</text>
    <rect x="402" y="338" width="72" height="20" rx="10" fill="#eef4fc"/><text x="412" y="352" fill="#3b7dd8">response</text>
    <text x="486" y="352" fill="#7d756d">240 ms · 3 skipped</text>
  </g>
  <!-- plugin: redact (code, healthy) -->
  <rect x="318" y="380" width="384" height="84" rx="10" fill="#fff" stroke="#2e9d62" stroke-width="1.6" filter="url(#sh)"/>
  <text x="334" y="402" font-size="13" font-weight="600" fill="#2b2724">🧩 redact-emails</text>
  <rect x="470" y="390" width="132" height="18" rx="9" fill="#fdeeee" stroke="#d64545" stroke-opacity="0.5"/>
  <text x="478" y="403" font-size="10.5" fill="#b33a3a">⚠ runs code in hearth</text>
  <circle cx="688" cy="396" r="4" fill="#2e9d62"/>
  <text x="334" y="422" font-size="11" fill="#7d756d">code · npm:@acme/hearth-redact@1.2.0 · peer-bound requests only</text>
  <g font-size="10.5">
    <rect x="334" y="434" width="62" height="20" rx="10" fill="#eef4fc"/><text x="345" y="448" fill="#3b7dd8">routed</text>
    <text x="408" y="448" fill="#7d756d">1 ms · 0 errors</text>
  </g>

  <!-- live particles on the path -->
  <circle cx="510" cy="228" r="3.5" fill="#2e9d62"/>
  <circle cx="510" cy="494" r="3.5" fill="#2e9d62"/>

  <!-- external plugin service -->
  <rect x="40" y="296" width="200" height="64" rx="10" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="56" y="318" font-size="13" font-weight="600" fill="#2b2724">🌐 memory service</text>
  <text x="56" y="336" font-size="11" fill="#7d756d">http://memory:7411</text>
  <text x="56" y="351" font-size="11" fill="#7d756d">plugin endpoint</text>
  <circle cx="226" cy="312" r="4" fill="#2e9d62"/>
  <path d="M318,328 C280,328 270,328 242,328" fill="none" stroke="#3b7dd8" stroke-width="1.5" marker-end="url(#arrP)"/>
  <text x="246" y="320" font-size="10" fill="#3b7dd8">hook call</text>

  <!-- dispatch -->
  <line x1="510" y1="482" x2="510" y2="520" stroke="#9a928a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="420" y="522" width="180" height="50" rx="10" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="436" y="543" font-size="13" font-weight="600" fill="#2b2724">⇄ Dispatch</text>
  <text x="436" y="561" font-size="11" fill="#7d756d">to a peer or a backend here</text>
  <circle cx="586" cy="538" r="4" fill="#3b7dd8"/>

  <!-- internal loop: plugin service calls back in, no hooks -->
  <path d="M140,360 C140,540 300,560 418,552" fill="none" stroke="#3b7dd8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrP)"/>
  <rect x="150" y="520" width="196" height="40" rx="8" fill="#fff" stroke="#3b7dd8" stroke-opacity="0.4"/>
  <text x="160" y="536" font-size="10.5" fill="#3b7dd8">internal calls: embed · rerank · chat</text>
  <text x="160" y="551" font-size="10.5" fill="#3b7dd8">plugins lane · hooks never run</text>

  <!-- peer -->
  <rect x="40" y="640" width="180" height="50" rx="10" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="56" y="661" font-size="13" font-weight="600" fill="#2b2724">🌐 friend</text>
  <text x="56" y="679" font-size="11" fill="#7d756d">lends you 1 · 1 of 1 free</text>
  <circle cx="206" cy="656" r="4" fill="#2e9d62"/>
  <path d="M440,572 C380,640 300,665 222,665" fill="none" stroke="#e7e4e0" stroke-width="1.5"/>

  <!-- this machine -->
  <rect x="660" y="610" width="400" height="200" rx="14" fill="#fff" stroke="#e7e4e0"/>
  <text x="678" y="634" font-size="12" font-weight="600" fill="#2b2724">🗄 this machine</text>
  <rect x="676" y="646" width="368" height="70" rx="10" fill="#f8f7f5" stroke="#ece9e5" stroke-dasharray="4 3"/>
  <text x="690" y="664" font-size="10.5" font-weight="600" fill="#7d756d">GPU0 · in use</text>
  <rect x="690" y="672" width="340" height="36" rx="8" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="704" y="694" font-size="12" font-weight="600" fill="#2b2724">swap</text><text x="746" y="694" font-size="11" fill="#7d756d">my-model</text>
  <circle cx="1016" cy="690" r="4" fill="#2e9d62"/>
  <rect x="676" y="724" width="368" height="74" rx="10" fill="#f8f7f5" stroke="#ece9e5" stroke-dasharray="4 3"/>
  <text x="690" y="742" font-size="10.5" font-weight="600" fill="#7d756d">CPU · shared</text>
  <rect x="690" y="750" width="340" height="38" rx="8" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="704" y="773" font-size="12" font-weight="600" fill="#2b2724">cpu-models</text><text x="784" y="773" font-size="11" fill="#7d756d">embed, rerank · lane: plugins</text>
  <circle cx="1016" cy="769" r="4" fill="#2e9d62"/>
  <path d="M600,550 C640,550 640,690 688,690" fill="none" stroke="#9a928a" stroke-width="1.5"/>
  <path d="M600,556 C650,560 640,769 688,769" fill="none" stroke="#3b7dd8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- response tap: after the reply, in the background -->
  <path d="M676,700 C640,600 760,380 704,344" fill="none" stroke="#d99a2b" stroke-width="1.3" stroke-dasharray="2 4"/>
  <text x="716" y="520" font-size="10.5" fill="#b07c1e">response tap · after the reply</text>
  <text x="716" y="534" font-size="10.5" fill="#b07c1e">background, never delays it</text>

  <!-- detail panel -->
  <rect x="760" y="20" width="320" height="380" rx="14" fill="#fff" stroke="#e7e4e0" filter="url(#sh)"/>
  <text x="780" y="48" font-size="15" font-weight="600" fill="#2b2724">🧩 memory</text>
  <rect x="990" y="34" width="72" height="22" rx="11" fill="#2e9d62"/><circle cx="1050" cy="45" r="8" fill="#fff"/>
  <text x="996" y="49" font-size="10.5" fill="#fff">on</text>
  <text x="780" y="68" font-size="11" fill="#7d756d">http · http://memory:7411 · reads messages, reply</text>
  <line x1="780" y1="82" x2="1060" y2="82" stroke="#efece8"/>
  <g font-size="11" fill="#2b2724">
    <text x="780" y="102" fill="#7d756d" font-weight="600">HOOK</text><text x="860" y="102" fill="#7d756d" font-weight="600">CALLS</text><text x="920" y="102" fill="#7d756d" font-weight="600">P50 / P95</text><text x="1010" y="102" fill="#7d756d" font-weight="600">ERR</text>
    <text x="780" y="124">routed</text><text x="860" y="124">1,204</text><text x="920" y="124">38 / 240 ms</text><text x="1010" y="124">3 skip</text>
    <text x="780" y="146">response</text><text x="860" y="146">1,190</text><text x="920" y="146">— (async)</text><text x="1010" y="146">0</text>
  </g>
  <line x1="780" y1="160" x2="1060" y2="160" stroke="#efece8"/>
  <text x="780" y="180" font-size="11" fill="#7d756d" font-weight="600">WHEN</text>
  <text x="780" y="198" font-size="11.5" fill="#2b2724">asked: coder, chat · callerNot: canary</text>
  <text x="780" y="220" font-size="11" fill="#7d756d" font-weight="600">ON ERROR</text>
  <text x="780" y="238" font-size="11.5" fill="#2b2724">skip (requests continue without it) · 300 ms</text>
  <text x="780" y="260" font-size="11" fill="#7d756d" font-weight="600">LENT WORK</text>
  <text x="780" y="278" font-size="11.5" fill="#2b2724">never runs on peers' requests</text>
  <text x="780" y="300" font-size="11" fill="#7d756d" font-weight="600">LAST ERROR</text>
  <text x="780" y="318" font-size="11.5" fill="#b33a3a">timeout after 300 ms · 4 min ago</text>
  <rect x="780" y="340" width="280" height="40" rx="8" fill="#f6f8fd" stroke="#3b7dd8" stroke-opacity="0.4"/>
  <text x="796" y="365" font-size="12" fill="#3b7dd8">Open the plugin's own panel ↗</text>

  <!-- legend -->
  <rect x="40" y="830" width="1020" height="52" rx="10" fill="#fff" stroke="#e7e4e0"/>
  <g font-size="11" fill="#2b2724">
    <rect x="58" y="848" width="18" height="14" rx="3" fill="#fff" stroke="#2e9d62" stroke-width="1.6"/><text x="82" y="859">healthy</text>
    <rect x="140" y="848" width="18" height="14" rx="3" fill="#fff" stroke="#d99a2b" stroke-width="1.6"/><text x="164" y="859">slow (near timeout)</text>
    <rect x="282" y="848" width="18" height="14" rx="3" fill="#fff" stroke="#d64545" stroke-width="1.6"/><text x="306" y="859">failing</text>
    <rect x="360" y="848" width="18" height="14" rx="3" fill="#f2f0ed" stroke="#c9c4be"/><line x1="358" y1="862" x2="380" y2="848" stroke="#9a928a"/><text x="386" y="859">off / not matched</text>
    <text x="500" y="859">⚠ runs code in hearth</text>
    <text x="640" y="859">🔒 kept local</text>
    <line x1="740" y1="855" x2="770" y2="855" stroke="#3b7dd8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="776" y="859">internal call, no hooks</text>
    <line x1="920" y1="855" x2="950" y2="855" stroke="#d99a2b" stroke-width="1.3" stroke-dasharray="2 4"/><text x="956" y="859">response tap</text>
  </g>
</svg>
